[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemlocker-bedrock"
version = "0.1.0"
description = "Official System Locker Bedrock client for Python — Ed25519-signed responses, rotating session tokens, and per-request challenges for software on untrusted machines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[project.urls]
Repository = "https://github.com/systemlocker/System-Locker-Bedrock-Python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systemlocker_bedrock = ["py.typed"]
